{% extends 'base.html' %}

{% block title %}TourQuadri - Redefinir Senha{% endblock %}

{% block content %}
<div class="card">
    <h2 class="logo-form">
        <span class="tour">Tour</span><span class="quadri">Quadri</span>
    </h2>
    <h3 class="subtitle">
        <i class="fas fa-lock"></i> Redefinir Senha
    </h3>

    <p class="text-center text-muted">
        Digite sua nova senha
    </p>

    <form action="/salvar_nova_senha" method="POST" id="form-redefinir-senha">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group-campo">
            <div class="password-wrapper">
                <input type="password" name="nova_senha" id="redefinir_nova_senha" placeholder="Nova Senha" required>
                <button type="button" class="password-toggle" onclick="toggleRedefinirNovaSenha()" aria-label="Mostrar/ocultar senha">
                    <i class="fas fa-eye-slash" id="iconeRedefinirNovaSenha"></i>
                </button>
            </div>
        </div>

        <div class="form-group-campo">
            <div class="password-wrapper">
                <input type="password" name="confirmar_senha" id="redefinir_confirmar_senha" placeholder="Confirmar Nova Senha" required>
                <button type="button" class="password-toggle" onclick="toggleRedefinirConfirmarSenha()" aria-label="Mostrar/ocultar senha">
                    <i class="fas fa-eye-slash" id="iconeRedefinirConfirmarSenha"></i>
                </button>
            </div>
            <span id="redefinir-confirmar-erro" class="mensagem-erro" style="display: none;">
                <i class="fas fa-exclamation-circle"></i> As senhas não coincidem
            </span>
        </div>

        <button class="btn" type="submit" id="btn-redefinir">
            <i class="fas fa-save"></i> Redefinir Senha
        </button>
    </form>

    <br>

    <a href="/login">
        <i class="fas fa-arrow-left"></i> Voltar para o Login
    </a>
</div>
{% endblock %}
