{% extends 'base.html' %}

{% block title %}TourQuadri - Login{% endblock %}

{% block content %}
<div class="card">
    <h2 class="logo-form">
        <span class="tour">Tour</span><span class="quadri">Quadri</span>
    </h2>
    <h3 class="subtitle">Entre na sua conta</h3>

    <form action="/autenticar" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group-campo">
            <label>E-mail</label>
            <input type="email" name="email" placeholder="Digite seu e-mail" value="{{ email or '' }}" required>
        </div>
        <div class="form-group-campo">
            <label>Senha</label>
            <div class="password-wrapper">
                <input type="password" name="senha" id="senhaLogin" placeholder="Digite sua senha" required>
                <button type="button" class="password-toggle" onclick="toggleSenhaLogin()" aria-label="Mostrar/ocultar senha">
                    <i class="fas fa-eye-slash" id="iconeSenhaLogin"></i>
                </button>
            </div>
        </div>
        <button class="btn" type="submit">Entrar</button>
    </form>

    <br>

    <div class="login-links">
        <a href="/register"><i class="fas fa-user-plus"></i> Criar Conta</a>
        <br><br>
        <a href="/esqueci_senha"><i class="fas fa-key"></i> Esqueceu sua senha?</a>
    </div>
</div>
{% endblock %}
